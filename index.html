<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thiranex Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar">

            <div class="logo">
                Thiranex Store
            </div>

            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#products">Products</a></li>
                <li><a href="#cart">Cart (<span id="cartCount">0</span>)</a></li>
                <li><a href="#login">Login</a></li>
            </ul>

        </nav>
    </header>


    <!-- Home -->
    <section id="home" class="hero">

        <div>
            <h1>Welcome to Thiranex Store</h1>

            <p>
                Discover quality products at affordable prices.
            </p>

            <a href="#products" class="btn">
                Shop Now
            </a>
        </div>

    </section>


    <!-- Products -->
    <section id="products" class="section">

        <h2>Our Products</h2>

        <div id="productContainer" class="product-grid">
            <!-- Products loaded using JavaScript -->
        </div>

    </section>


    <!-- Cart -->
    <section id="cart" class="section">

        <h2>Shopping Cart</h2>

        <div id="cartContainer"></div>

        <h3>
            Total: ₹<span id="cartTotal">0</span>
        </h3>

        <button
            id="checkoutBtn"
            class="btn">
            Proceed to Checkout
        </button>

    </section>


    <!-- Login -->
    <section id="login" class="section">

        <h2>Login</h2>

        <form id="loginForm">

            <input
                type="email"
                id="loginEmail"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required
            >

            <button
                type="submit"
                class="btn">
                Login
            </button>

        </form>

    </section>


    <script src="script.js"></script>

</body>

</html>
